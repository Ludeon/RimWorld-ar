name: Weekly Arabic RTL Release

on:
  schedule:
    - cron: '0 21 * * 4'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build all variants
        run: npm run build

      - name: Create ZIP archives
        run: |
          cd dist
          (cd Data-Normal && zip -r ../Data-Normal.zip Data)
          (cd Data-WordWrap && zip -r ../Data-WordWrap.zip Data)
          (cd Data-ArabicSupport && zip -r ../Data-ArabicSupport.zip Data Mods)
          ls -lh *.zip

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        run: |
          gh release delete latest-release --yes || true
          git push origin :refs/tags/latest-release || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create updated release
        run: |
          gh release create latest-release \
            --title "Arabic Translation — Updated ${{ steps.date.outputs.DATE }}" \
            --notes "## تعريب ريمورلد — آخر تحديث: ${{ steps.date.outputs.DATE }}

          ## 🛠️ نسخ التعريب المتاحة (Releases)

          **بسبب القيود التقنية في محرك اللعبة فيما يخص اللغة العربية (RTL)، تم توفير ثلاث نسخ حسب الرغبة:**
          1. نسخة **Data-WordWrap** : التعريب يظهر بحروف متصلة و تستطيع أن تقرأ من الأعلى إلى الأسفل لكن الكلمات تتجمع في الجهة اليسرى.
          2. نسخة **Data-Normal** : التعريب يظهر بحروف متصلة مع طول نصوص طبيعي لكن يجب أن تقرأ النصوص من الأسفل إلى الأعلى.
          3. نسخة **Data-ArabicSupport** : التعريب يظهر بحروف متصلة و يأتي هذا التعريب مع مود (\`ArabicSupport\`) ليجعل النصوص تُقرأ من الأعلى إلى الأسفل مع طول نصوص طبيعي.

          ---

          ## 🚀 طريقة التثبيت (Installation)

          **الشرح:**
          1. **حمّل النسخة المناسبة**
          2. **فك ضغط ملف الـ \`ZIP\`**
          3. **انسخ مجلد \`Data\` وألصقه داخل مجلد اللعبة الرئيسي (\`RimWorld\`)**
          4. **في حال كنت تستخدم نسخة Data-ArabicSupport ، فقط قم بفك الضغط و سيتم لصق المجلدات في المكان الصحيح ( الترجمة و المود )**


          ### 1. نسخة Steam 🎮
          المسار الافتراضي:
          \`C:\Program Files (x86)\Steam\steamapps\common\RimWorld\`

          ### 2. نسخة GOG 📂
          المسار الافتراضي:
          \`C:\GOG Games\RimWorld\`
            " \
            dist/Data-Normal.zip \
            dist/Data-WordWrap.zip \
            dist/Data-ArabicSupport.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
